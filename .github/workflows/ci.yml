name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BattleHub.Matchmaking.slnx
      - name: Build
        run: dotnet build BattleHub.Matchmaking.slnx --no-restore --configuration Release
      - name: Lint
        run: dotnet format BattleHub.Matchmaking.slnx --verify-no-changes --no-restore
      - name: Unit tests and coverage
        run: dotnet test tests/BattleHub.Matchmaking.UnitTests/BattleHub.Matchmaking.UnitTests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults/unit
      - name: Integration tests and coverage
        run: dotnet test tests/BattleHub.Matchmaking.IntegrationTests/BattleHub.Matchmaking.IntegrationTests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults/integration
      - name: Merge coverage reports
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.1
          reportgenerator '-reports:TestResults/**/coverage.cobertura.xml' '-targetdir:TestResults/report' '-reporttypes:Cobertura;Html' '-filefilters:-**/*.generated.cs'
      - name: Coverage gate
        id: coverage
        run: python scripts/coverage-summary.py TestResults/report/Cobertura.xml TestResults/coverage-summary.md
      - name: Comment coverage on pull request
        if: ${{ always() && github.event_name == 'pull_request' && steps.coverage.outcome != 'skipped' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- battlehub-coverage -->';
            const body = marker + '\n' + fs.readFileSync('TestResults/coverage-summary.md', 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const existing = comments.find(c => c.user.type === 'Bot' && c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
      - name: Docker build
        run: docker build .
