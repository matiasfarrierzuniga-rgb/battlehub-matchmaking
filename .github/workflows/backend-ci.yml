name: CI - Backend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BattleHub.Matchmaking.sln

      - name: Build
        run: >-
          dotnet build BattleHub.Matchmaking.sln
          --no-restore
          --configuration Release
          -m:1

      - name: Run unit tests
        run: >-
          dotnet test tests/BattleHub.Matchmaking.Tests/BattleHub.Matchmaking.Tests.csproj
          --no-build
          --configuration Release
          --filter "Category=Unit"

      - name: Run integration tests
        run: >-
          dotnet test tests/BattleHub.Matchmaking.Tests/BattleHub.Matchmaking.Tests.csproj
          --no-build
          --configuration Release
          --filter "Category=Integration"
