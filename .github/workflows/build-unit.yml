name: Build and Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BattleHub.Matchmaking.slnx
      - run: dotnet build BattleHub.Matchmaking.slnx --no-restore --configuration Release
      - run: dotnet test tests/BattleHub.Matchmaking.UnitTests/BattleHub.Matchmaking.UnitTests.csproj --no-build --configuration Release
