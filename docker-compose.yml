services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - matchmaking-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  matchmaking:
    build: .
    ports:
      - "5211:8080"
    environment:
      Auth0__Domain: ${AUTH0_DOMAIN}
      Auth0__Audience: ${AUTH0_AUDIENCE}
      MongoDb__ConnectionString: mongodb://mongodb:27017
      MongoDb__DatabaseName: battlehub_matchmaking
      Profile__BaseUrl: ${PROFILE_BASE_URL:-http://host.docker.internal:5220}
      Cors__Origins__0: http://localhost:4000
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  matchmaking-mongo:
