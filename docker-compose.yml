services:
  mongodb:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - matchmaking-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand({ ping: 1 }).ok !== 1) quit(1)"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s

  data-generator:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_CONNECTION_STRING: ${MONGO_CONNECTION_STRING:-mongodb://mongodb:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-battlehub_matchmaking}
    volumes:
      - ./docker/demo-data.js:/demo-data.js:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec mongosh "$$MONGO_CONNECTION_STRING" --quiet /demo-data.js']
    restart: "no"

  matchmaking:
    build: .
    ports:
      - "${MATCHMAKING_PORT:-5211}:8080"
    environment:
      Auth0__Domain: ${AUTH0_DOMAIN:-}
      Auth0__Audience: ${AUTH0_AUDIENCE:-}
      MongoDb__ConnectionString: ${MONGO_CONNECTION_STRING:-mongodb://mongodb:27017}
      MongoDb__DatabaseName: ${MONGO_DATABASE:-battlehub_matchmaking}
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost:4000}
    depends_on:
      mongodb:
        condition: service_healthy
      data-generator:
        condition: service_completed_successfully

volumes:
  matchmaking-mongo:
